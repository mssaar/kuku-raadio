name: Kuku sync

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "kuku/**", ".github/workflows/sync.yml"]

concurrency:
  group: kuku-sync
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # alati haru värskeim seis (järjekorras ootav käivitus ei tohi alustada vanast commitist)
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt
      - name: Testid
        run: |
          python -m pytest -q
          npm test
      - name: Sünkroniseeri Kuku
        id: sync
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m kuku.sync
      - name: Salvesta andmed
        id: save
        if: always() && steps.sync.outcome != 'skipped'
        run: |
          git config user.name "kuku-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if ! git diff --cached --quiet; then
            git commit -m "Andmete uuendus"
            if ! git pull --rebase origin main; then
              git rebase --abort
              echo "::error::Andmete commit läks vastuollu, leht jääb uuendamata"
              exit 1
            fi
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        if: always() && steps.save.outcome == 'success'
        with:
          path: site
      - id: deploy
        if: always() && steps.save.outcome == 'success'
        uses: actions/deploy-pages@v4
      - name: Märgi sync'i viga
        if: steps.sync.outcome == 'failure'
        run: exit 1
